# The release route: `ship_app ios|macos|android [--dry-run]` (enspyrco/cli-tools,
# ship_app/README.md). Committing this file makes asc AND gplay refuse an
# upload that didn't come through ship_app, so tool/ship.dart is no longer a
# route, for any platform.
app: aiko                      # the app's name in ~/.config/appstore/apps.json
defines:
  commit: GIT_SHA              # read by lib/core/diagnostics/error_report.dart (kGitSha)
  file: dart_defines/prod.json
ios:
  codesign: archive            # flutter build ipa --export-options-plist signs, as
                               # tool/ship.dart did: automatic signing needs
                               # -allowProvisioningUpdates, which export mode doesn't pass
  export_options: ios/ExportOptions.plist
macos:                         # asc mas-package builds from macos/ExportOptions.plist
android:
  track: production            # required: a production upload is a submission
                               # No data_safety: the upload leaves Play's Data safety
                               # form as it was set in the Console.
# No declarations: section yet. How it treats merge commits (aiko merges PRs
# with merge commits) is still being decided with cli-tools.
